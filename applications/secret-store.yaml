apiVersion: external-secrets.io/v1beta1
kind: SecretStore

metadata:
  name: vault-secret-store
  namespace: argocd

spec:
  provider:
    vault:
      server: https://vault.awsdevopstrainers.info/
      path: kv/artifactory-secret
      version: v1

      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-role
          serviceAccountRef:
            name: default