apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/naresh240/argo-applications.git'
    targetRevision: main
    path: applications
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true